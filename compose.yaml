services:
  mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: goodbooks-faq-mcp:local
    env_file:
      - .env
    environment:
      MCP_SERVER_HOST: 0.0.0.0
      MCP_SERVER_PORT: 8071
    ports:
      - "127.0.0.1:8071:8071"
    volumes:
      - ./storage/uploads:/app/storage/uploads
      - ./storage/extracted:/app/storage/extracted
    init: true
    restart: unless-stopped
