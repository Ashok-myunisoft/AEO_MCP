
name: Docker Build and Push to Docker Hub

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Credentials
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASS: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          test -n "$DOCKER_USER" || (echo "Docker username missing" && exit 1)
          test -n "$DOCKER_PASS" || (echo "Docker password/token missing" && exit 1)
          echo "Docker credentials are available"

      - name: Login to Docker Hub
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          tags: |
            YOUR_DOCKERHUB_USERNAME/mcp:latest
            YOUR_DOCKERHUB_USERNAME/mcp:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
